name: Python wheels

# Builds the Python package's wheels (and sdist) on every push and pull
# request, testing each wheel with python/tests. Pushing a "v*" tag also
# publishes them to PyPI, through PyPI trusted publishing: the "pypi"
# environment of this repository must be registered as a trusted publisher
# of the "mathoptmodel" project on pypi.org (no API token needed).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-latest]
    steps:
      - uses: actions/checkout@v4
      # Which wheels are built (one stable-ABI wheel per platform) and how
      # they're tested is configured in pyproject.toml's [tool.cibuildwheel].
      - uses: pypa/cibuildwheel@v4.3.5
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.15"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
